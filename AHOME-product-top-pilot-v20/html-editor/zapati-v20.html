<script>
(() => {
  if (window.__midaGa4Relay) return;
  window.__midaGa4Relay = true;
  const sent = new Set();
  const send = event => {
    if (!event || !/^mida_(execute|pageview|conversion)$/.test(event.event) || typeof window.gtag !== 'function') return;
    const key = `${event.event}|${event.id}|${event.variant}|${event.timestamp}`;
    if (sent.has(key)) return;
    sent.add(key);
    window.gtag('event', event.event, { send_to: 'G-P6P6Q7FHDN', id: event.id, name: event.name, variant: event.variant, uuid: event.uuid, timestamp: event.timestamp, event_name: event.event_name });
  };
  const dataLayer = window.dataLayer = window.dataLayer || [];
  dataLayer.forEach(send);
  const push = dataLayer.push;
  dataLayer.push = function(...events) {
    events.forEach(send);
    return push.apply(this, events);
  };
})();
</script>

<script>
(() => {
  const PRICE_TEST_ID = 28597;
  const PRICE_TEST_PATH = '/drevena-vune-do-auta-fresh-wood-tati-jezdi-opatrne/';
  const EXECUTE_KEY = `mida-executed-${PRICE_TEST_ID}`;
  const revenueSeen = window.__midaPurchaseSeen || (window.__midaPurchaseSeen = new Set());

  const getConsent = event => {
    const direct = event?.detail?.cookie_consent || event?.cookie_consent;
    if (direct) return direct.analytics;
    const dataLayer = window.dataLayer || [];
    for (let index = dataLayer.length - 1; index >= 0; index -= 1) {
      if (dataLayer[index]?.cookie_consent) return dataLayer[index].cookie_consent.analytics;
    }
    return window.cookie_consent?.analytics;
  };

  const grantConsent = event => {
    if (window.__midaConsentBusy) return;
    window.__midaConsentBusy = true;
    try {
      const analytics = getConsent(event);
      const granted = analytics === true || analytics === 'granted';
      const denied = analytics === false || analytics === 'denied';
      if (granted) {
        window.mida?.grantConsent?.(true);
        if (sessionStorage.getItem(EXECUTE_KEY)) return;
        if (/[?&](?:kupon|ab_price|coupon)=/.test(location.search)) {
          sessionStorage.setItem(EXECUTE_KEY, '1');
          return;
        }
        const data = window.getShoptetDataLayer?.();
        const cartQty = data?.cart?.reduce((sum, item) => sum + (item.quantity || 0), 0) || 0;
        if (location.pathname === PRICE_TEST_PATH && cartQty === 0) {
          sessionStorage.setItem(EXECUTE_KEY, '1');
          window.mida?.execute?.(PRICE_TEST_ID);
        }
      } else if (denied) {
        window.mida?.grantConsent?.(false);
      }
    } finally {
      window.__midaConsentBusy = false;
    }
  };

  document.addEventListener('cookie_consent', grantConsent);
  document.addEventListener('update_consent', grantConsent);
  window.addEventListener('load', grantConsent);
  grantConsent();

  const handlePurchase = event => {
    const purchase = event?.event === 'purchase' && event.ecommerce
      ? event.ecommerce
      : event?.[0] === 'event' && event?.[1] === 'purchase'
        ? event[2]?.ecommerce || event[2]
        : null;
    if (!purchase) return;
    const tx = String(purchase.transaction_id || purchase.id || '');
    if (!tx || revenueSeen.has(tx) || sessionStorage.getItem(`mida-purchase-${tx}`)) return;
    revenueSeen.add(tx);
    sessionStorage.setItem(`mida-purchase-${tx}`, '1');
    const order = window.getShoptetDataLayer?.()?.order;
    const orderValue = Number(order?.total) - Number(order?.shipping);
    const value = Number.isFinite(orderValue)
      ? orderValue
      : Number(purchase.value || purchase.revenue || 0);
    const coupon = order?.discountCoupons?.[0]?.code || String(purchase.coupon || '').split('~')[0] || null;
    window.mdq = window.mdq || [];
    window.mdq.push(['track', 'purchase_revenue', {
      transactionID: tx,
      revenue: value,
      currency: purchase.currency || order?.currencyCode || 'CZK',
      coupon
    }]);
  };

  const dataLayer = window.dataLayer = window.dataLayer || [];
  dataLayer.forEach(handlePurchase);
  const push = dataLayer.push;
  dataLayer.push = function (...events) {
    events.forEach(handlePurchase);
    return push.apply(this, events);
  };
})();
</script>
